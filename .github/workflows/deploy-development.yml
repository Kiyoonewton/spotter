name: Deploy to Development

# workflow_run cannot be used here: GitHub only discovers workflow_run
# listener workflows from the file as it exists on the default branch
# (main for this repo), not on develop where this workflow currently
# lives — so a Frontend CI run on develop would never trigger it. Running
# the quality gate directly in this workflow, gated on develop pushes,
# avoids that limitation while still deploying only commits that pass it.
on:
  push:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  group: deploy-development
  cancel-in-progress: true

jobs:
  quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotter-frontend/apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: spotter-frontend/apps/web/.nvmrc
          cache: yarn
          cache-dependency-path: spotter-frontend/apps/web/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create placeholder env files
        run: |
          echo "VITE_API_BASE_URL=/api" > .env
          echo "VITE_API_BASE_URL=/api" > .env.test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run quality gate (lint, typecheck, format, unit/RTL/MSW tests, Playwright, build)
        run: yarn quality

  deploy:
    name: deploy
    needs: quality
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required configuration
        run: |
          if [ -z "${{ vars.DEV_HOST }}" ]; then
            echo "DEV_HOST is not configured" >&2
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.DEV_HOST }}" >> ~/.ssh/known_hosts

      # .env / .env.* are per-environment and must only ever be edited on
      # the server directly (see spotter-infrastructure's docs) — never
      # overwritten by a deploy. node_modules is rebuilt inside the Docker
      # image; test reports and coverage are CI-only artifacts.
      - name: Sync frontend source to the Development server
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='coverage/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            spotter-frontend/ "root@${{ vars.DEV_HOST }}:/root/kiyoo/spotter-new/spotter-frontend/"

      - name: Rebuild and restart webserver
        run: |
          ssh "root@${{ vars.DEV_HOST }}" '
            set -euo pipefail
            cd /root/kiyoo/spotter-new/spotter-infrastructure
            docker compose --env-file .env.development -f docker-compose.development.yml up -d --build webserver
          '

      - name: Verify deployment
        run: |
          ssh "root@${{ vars.DEV_HOST }}" '
            curl -fsS -H "Host: dev-spotter.kiyoo.online" http://127.0.0.1:8080/api/health
          '
