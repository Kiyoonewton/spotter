name: Deploy to Development

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-development
  # A second push must not interrupt migrations or a running rollout.
  cancel-in-progress: false

jobs:
  gate:
    name: Full-stack deployment gate
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require successful CI for this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const { waitForChecks } = require('./scripts/deployment-gate.cjs');
            await waitForChecks({ github, core, context });

  deploy:
    name: deploy
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    env:
      DEV_HOST: ${{ vars.DEV_HOST }}
      DEPLOY_USER: ${{ vars.DEV_USER || 'root' }}
      DEPLOY_PATH: ${{ vars.DEV_PATH || '/root/kiyoo/spotter-new' }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
    steps:
      - name: Reject stale rollout after waiting for approval
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/develop' });
            if (data.object.sha !== context.sha) core.setFailed('Develop advanced; deploy its latest verified commit instead');

      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          [[ "$DEV_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo "Valid DEV_HOST is required" >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Invalid DEV_USER" >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_PATH" != / && "$DEPLOY_PATH" != *'/../'* && "$DEPLOY_PATH" != */.. ]] || { echo "Invalid DEV_PATH" >&2; exit 1; }
          [[ -n "$SSH_KNOWN_HOSTS" ]] || { echo "Pinned DEV_SSH_KNOWN_HOSTS is required" >&2; exit 1; }

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Install pinned host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check server prerequisites
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEV_HOST" \
            "test -f '$DEPLOY_PATH/spotter-infrastructure/.env.development' && command -v docker >/dev/null && docker compose version >/dev/null"

      - name: Sync complete stack, preserving server runtime files
        run: |
          export RSYNC_RSH='ssh -o BatchMode=yes -o StrictHostKeyChecking=yes'
          bash spotter-infrastructure/scripts/sync-development.sh "$GITHUB_WORKSPACE" "$DEPLOY_USER@$DEV_HOST:$DEPLOY_PATH"

      - name: Build, back up and verify complete stack
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEV_HOST" \
            "bash '$DEPLOY_PATH/spotter-infrastructure/scripts/deploy-development.sh' '$DEPLOY_PATH'"
