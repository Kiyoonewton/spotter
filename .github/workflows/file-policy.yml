name: File policy

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'feat/**', 'fix/**']

permissions:
  contents: read

jobs:
  file-length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-file-lengths.sh
