name: Docker Validation

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  docker-validation:
    name: docker-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create placeholder .env files
        run: |
          touch spotter-backend/.env
          cp spotter-infrastructure/.env.example spotter-infrastructure/.env
          cp spotter-infrastructure/.env.development.example spotter-infrastructure/.env.development

      - name: Validate Local Compose config
        working-directory: spotter-infrastructure
        run: docker compose -f docker-compose.local.yml config --quiet

      - name: Validate Development Compose config
        working-directory: spotter-infrastructure
        run: docker compose -f docker-compose.development.yml --env-file .env.development config --quiet

      - name: Validate Production Compose config
        working-directory: spotter-infrastructure
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build Local services
        working-directory: spotter-infrastructure
        run: docker compose -f docker-compose.local.yml build

      # Both Development and Production build the webserver with
      # `context: ..` (the workspace root, which here is $GITHUB_WORKSPACE)
      # so its Dockerfile can reach both spotter-frontend/ and
      # spotter-infrastructure/webserver/. workspace.dockerignore is
      # copied into place at that root first — exactly the documented
      # local step — so the build context stays limited to those two
      # directories and spotter-backend/.env can never be sent to Docker.
      - name: Copy workspace.dockerignore into place for the wide build context
        run: cp spotter-infrastructure/workspace.dockerignore .dockerignore

      - name: Build Development webserver image
        working-directory: spotter-infrastructure
        run: docker compose -f docker-compose.development.yml --env-file .env.development build webserver

      - name: Build Production webserver image
        working-directory: spotter-infrastructure
        run: docker compose -f docker-compose.prod.yml build webserver
