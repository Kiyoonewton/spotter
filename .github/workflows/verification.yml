name: Spotter verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  backend:
    name: Django backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotter-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: spotter-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py test

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotter-frontend/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: spotter-frontend/apps/web/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
