name: Spotter verification

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'feat/**', 'fix/**']

permissions:
  contents: read

jobs:
  backend:
    name: Django backend
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: spotter-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: spotter-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py test

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotter-frontend/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: spotter-frontend/apps/web/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  deployment-security-contract:
    name: Deployment security contract
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      security-events: read
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/deployment-gate.test.cjs
      - name: Verify gate against actual merged develop security results
        uses: actions/github-script@v7
        with:
          script: |
            const { waitForChecks } = require('./scripts/deployment-gate.cjs');
            const target = { ...context, sha: context.payload.pull_request.base.sha, ref: 'refs/heads/develop' };
            await waitForChecks({ github, core, context: target });
