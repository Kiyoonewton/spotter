services:
  webserver:
    build:
      context: ..
      dockerfile: ./spotter-infrastructure/webserver/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        CONF_ENV: development
    image: spotter-webserver:development
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-dev.spotter.com}
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8085}:80"
    depends_on:
      spotter-frontend:
        condition: service_healthy
      spotter-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null --header 'Host: ${PUBLIC_HOST:-dev.spotter.com}' http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  spotter-frontend:
    build:
      context: ..
      dockerfile: ./spotter-infrastructure/webserver/Dockerfile.prod
      target: frontend-runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: spotter-frontend:development
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  spotter-backend:
    build:
      context: ../spotter-backend
      dockerfile: Dockerfile
    image: spotter-backend:development
    env_file:
      - .env.development
    environment:
      DJANGO_DEBUG: "false"
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check"]
      interval: 5s
      timeout: 10s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - spotter_development_postgres_data:/var/lib/postgresql/data
    # Not published to the host — only reachable from other containers on
    # this compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - spotter_development_redis_data:/data
    # Not published to the host — only reachable from other containers on
    # this compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  spotter_development_postgres_data:
  spotter_development_redis_data:
