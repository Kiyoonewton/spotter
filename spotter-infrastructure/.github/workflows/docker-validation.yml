name: Docker Validation

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  docker-validation:
    name: docker-validation
    runs-on: ubuntu-latest
    steps:
      # Checks out the three repos as siblings, exactly matching the local
      # dev workspace layout (work-space/spotter-{frontend,backend,infrastructure}),
      # since docker-compose.local.yml's build contexts (../spotter-frontend,
      # ../spotter-backend) depend on that relative structure.
      - name: Check out spotter-infrastructure
        uses: actions/checkout@v4
        with:
          path: spotter-infrastructure

      # These are private repositories. The default GITHUB_TOKEN issued to
      # this workflow only has access to the repo it runs in
      # (spotter-infrastructure) — it cannot check out sibling private
      # repos in the same org. CROSS_REPO_CHECKOUT_TOKEN must be a
      # fine-grained PAT or GitHub App installation token with (at minimum)
      # Contents: Read on spotter-frontend and spotter-backend. See the
      # README for exactly what to create and where to add it as a secret.
      - name: Check out spotter-frontend
        uses: actions/checkout@v4
        with:
          repository: Spotterv1/spotter-frontend
          ref: develop
          token: ${{ secrets.CROSS_REPO_CHECKOUT_TOKEN }}
          path: spotter-frontend

      - name: Check out spotter-backend
        uses: actions/checkout@v4
        with:
          repository: Spotterv1/spotter-backend
          ref: develop
          token: ${{ secrets.CROSS_REPO_CHECKOUT_TOKEN }}
          path: spotter-backend

      # docker compose config / build resolve env_file entries even when
      # not starting containers. None of these .env files exist in a fresh
      # checkout — these are empty/placeholder values, no real secrets,
      # matching what a developer would get from `cp .env.example .env`
      # before ever editing it.
      - name: Create placeholder .env files
        run: |
          touch spotter-backend/.env
          cp spotter-infrastructure/.env.example spotter-infrastructure/.env
          cp spotter-infrastructure/.env.development.example spotter-infrastructure/.env.development

      - name: Validate Local Compose config
        working-directory: spotter-infrastructure
        run: docker compose -f docker-compose.local.yml config --quiet

      - name: Validate Development Compose config
        working-directory: spotter-infrastructure
        run: docker compose -f docker-compose.development.yml --env-file .env.development config --quiet

      - name: Validate Production Compose config
        working-directory: spotter-infrastructure
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build Local services
        working-directory: spotter-infrastructure
        run: docker compose -f docker-compose.local.yml build

      # Both Development and Production build the webserver with
      # `context: ..` (the workspace root, which here is $GITHUB_WORKSPACE)
      # so its Dockerfile can reach both spotter-frontend/ and
      # spotter-infrastructure/webserver/. workspace.dockerignore is
      # copied into place at that root first — exactly the documented
      # local step — so the build context stays limited to those two
      # directories and spotter-backend/.env can never be sent to Docker.
      - name: Copy workspace.dockerignore into place for the wide build context
        run: cp spotter-infrastructure/workspace.dockerignore .dockerignore

      - name: Build Development webserver image
        working-directory: spotter-infrastructure
        run: docker compose -f docker-compose.development.yml --env-file .env.development build webserver

      - name: Build Production webserver image
        working-directory: spotter-infrastructure
        run: docker compose -f docker-compose.prod.yml build webserver
