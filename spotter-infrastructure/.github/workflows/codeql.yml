name: CodeQL

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: read

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      # `upload: false` — GitHub code scanning upload requires GitHub
      # Advanced Security, unavailable for private repos on this org's
      # current Free plan (see README). Analysis itself still runs and
      # still fails the job on a genuine setup/analysis error; only the
      # upload-to-GitHub step is skipped. Results are downloadable as a
      # workflow artifact instead — see the next step.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          upload: false
          output: sarif-results

      - name: Upload SARIF results as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-results
          path: sarif-results
          retention-days: 7
          if-no-files-found: ignore
