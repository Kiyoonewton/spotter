upstream spotter_frontend {
  server spotter-frontend:5173;
}

upstream spotter_backend {
  server spotter-backend:8000;
}

server {
  listen 80;
  server_name spotter.kiyoo;

  location /api/ {
    proxy_pass http://spotter_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
  }

  location / {
    proxy_pass http://spotter_frontend;
    include /etc/nginx/snippets/proxy-headers.conf;
  }
}