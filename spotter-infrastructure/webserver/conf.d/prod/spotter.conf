upstream spotter_backend {
  server spotter-backend:8000;
}

server {
  listen 80;
  server_name spotter.kiyoo;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://spotter_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
    add_header X-Request-ID $request_id always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
